name: Release

# Pushing a tag such as v0.2.0 builds and publishes a release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          for target in amd64:amd64: arm64:arm64: armv7:arm:7; do
            IFS=: read -r name goarch goarm <<<"$target"
            asset="alertly-agent-linux-${name}"
            GOOS=linux GOARCH="$goarch" GOARM="$goarm" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${asset}" .
            (cd dist && sha256sum "$asset" > "${asset}.sha256")
          done
          ls -l dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Alertly agent ${GITHUB_REF_NAME#v}" \
            --notes "Linux binaries of the Alertly server agent. Install it from the server page in your Alertly dashboard." \
            --latest
